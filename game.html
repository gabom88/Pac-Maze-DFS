<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>PAC-MAZE DFS</title>
    <meta name="theme-color" content="#000" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      /* Tema GameBoy: tiñe el elemento entero (HUD, canvas, palanca, botones)
         a un verde monocromático, en vez de recolorear cada estilo por separado. */
      .gb-filter {
        filter: grayscale(1) sepia(1) hue-rotate(62deg) saturate(5) brightness(0.92)
          contrast(1.05);
      }
      html,
      body {
        background: #000;
        color: #fff;
        font-family: 'Courier New', Courier, monospace;
        overflow: hidden;
        touch-action: none;
        height: 100%;
        width: 100%;
        -webkit-user-select: none;
        user-select: none;
      }
      #wrap {
        display: flex;
        flex-direction: column;
        height: 100dvh; /* dynamic viewport height - clave para móvil */
        width: 100vw;
      }

      /* HUD compacto — una sola línea fina */
      #hud {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        height: 36px;
        background: linear-gradient(#000, #050505);
        border-bottom: 1px solid #2a2200;
        box-shadow: 0 1px 8px #ffd70022;
        font-size: 12px;
        letter-spacing: 0.5px;
        white-space: nowrap;
      }
      #hud .hitem {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      #hud .hval {
        color: #ffd700;
        font-weight: 700;
        min-width: 28px;
        text-align: right;
        text-shadow: 0 0 6px #ffd70088;
      }
      .lives-icons {
        display: flex;
        gap: 3px;
        align-items: center;
      }
      .life-icon {
        width: 10px;
        height: 10px;
        background: #ffd700;
        border-radius: 50%;
        box-shadow: 0 0 4px #ffd700aa;
      }

      /* Canvas wrapper */
      #stage {
        flex: 1 1 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
        touch-action: none;
      }
      #game {
        display: block;
        touch-action: none;
      }

      /* CRT vignette + scanlines overlay, sized to match the canvas in JS */
      .crt-overlay {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        pointer-events: none;
        z-index: 2;
        border-radius: 4px;
        background:
          repeating-linear-gradient(rgba(0, 0, 0, 0) 0px, rgba(0, 0, 0, 0) 2px, rgba(0, 0, 0, 0.1) 3px),
          radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 55%, rgba(0, 0, 0, 0.55) 100%);
      }

      /* Overlay (start / game over) */
      #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.86);
        z-index: 10;
        gap: 14px;
      }
      #overlay h1 {
        font-size: clamp(20px, 6vw, 36px);
        color: #ffd700;
        letter-spacing: 2px;
        max-width: 92%;
        text-align: center;
        animation: pm-title-pulse 2.2s ease-in-out infinite;
      }
      #overlay-score {
        display: none;
        font-size: clamp(14px, 3.5vw, 18px);
        color: #fff;
        font-weight: 700;
        letter-spacing: 1px;
      }
      @keyframes pm-title-pulse {
        0%,
        100% {
          text-shadow:
            0 0 8px #ffd700,
            0 0 22px #ffd70066;
        }
        50% {
          text-shadow:
            0 0 16px #ffd700,
            0 0 38px #ffd700cc;
        }
      }
      #overlay p {
        font-size: clamp(12px, 3vw, 16px);
        color: #aaa;
        text-align: center;
        padding: 0 20px;
      }
      .option-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 7px;
      }
      .option-label {
        font-size: 10px;
        letter-spacing: 2.5px;
        color: #777;
      }
      .btn-row {
        display: flex;
        gap: 10px;
      }
      .diff-btn,
      .ctrl-btn {
        padding: 10px 18px;
        border: 2px solid #444;
        border-radius: 6px;
        background: #111;
        color: #fff;
        font-family: inherit;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        transition: all 0.15s;
        -webkit-tap-highlight-color: transparent;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .diff-btn span.dlabel,
      .ctrl-btn span.dlabel {
        font-size: 11px;
        opacity: 0.7;
        font-weight: 400;
      }
      .diff-btn:active,
      .ctrl-btn:active {
        transform: scale(0.95);
      }
      .diff-btn.selected,
      .ctrl-btn.selected {
        border-color: #ffd700;
        color: #ffd700;
        background: #1a1500;
        box-shadow: 0 0 14px #ffd70044;
      }
      .coffee-btn {
        border: none;
        border-radius: 6px;
        background: #ffdd00;
        color: #000;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        padding: 8px 14px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        transition: opacity 0.15s;
      }
      .coffee-btn:hover,
      .coffee-btn:active {
        opacity: 0.8;
      }
      #startBtn {
        margin-top: 10px;
        padding: 11px 40px;
        background: #ffd700;
        color: #000;
        border: none;
        border-radius: 4px;
        font-family: inherit;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 2px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        animation: pm-btn-pulse 2s ease-in-out infinite;
      }
      #startBtn:active {
        opacity: 0.8;
      }
      @keyframes pm-btn-pulse {
        0%,
        100% {
          box-shadow: 0 0 12px #ffd70055;
        }
        50% {
          box-shadow: 0 0 22px #ffd700aa;
        }
      }

      /* Palanca arcade (joystick analógico flotante: aparece donde se toca) */
      .joystick {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -50%);
        width: 108px;
        height: 108px;
        z-index: 6;
        pointer-events: none;
        opacity: 0.55;
      }
      .joystick.pressed {
        opacity: 0.85;
      }
      .joystick.hidden {
        display: none;
      }
      .joystick-base {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #2a2a2a, #0a0a0a 70%);
        border: 3px solid #444;
        box-shadow:
          inset 0 0 14px rgba(0, 0, 0, 0.85),
          0 0 16px #ffd70033;
      }
      .joystick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        transform: translate(-50%, -50%);
        background: radial-gradient(circle at 35% 30%, #ffe066, #ffd700 55%, #b8860b 100%);
        box-shadow:
          0 3px 6px rgba(0, 0, 0, 0.6),
          0 0 10px #ffd70088;
      }

      /* Botones de acción de poderes (láser / teletransporte) */
      .pw-btns {
        position: absolute;
        right: 14px;
        bottom: 20px;
        z-index: 6;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .pw-btn {
        position: relative;
        width: 60px;
        height: 60px;
        border-radius: 50%;
        border: 2px solid #444;
        background: radial-gradient(circle at 35% 30%, #262626, #000 70%);
        color: #ffd700;
        font-size: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        opacity: 0.85;
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }
      .pw-btn.hidden {
        display: none;
      }
      .pw-btn:disabled {
        opacity: 0.4;
        color: #888;
      }
      .pw-btn:active:not(:disabled) {
        transform: scale(0.92);
      }
      .pw-icon {
        pointer-events: none;
      }
      .pw-key {
        position: absolute;
        top: -6px;
        right: -6px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #ffd700;
        color: #000;
        font-size: 10px;
        font-weight: 800;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #000;
        pointer-events: none;
      }
      /* Halo de recarga: se dibuja en sentido horario a medida que --cd va de 0 a 1 */
      .pw-btn {
        --cd: 1;
      }
      .pw-btn::before {
        content: '';
        position: absolute;
        inset: -5px;
        border-radius: 50%;
        background: conic-gradient(#7fffea calc(var(--cd) * 360deg), transparent 0deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 4px));
        opacity: 0;
        transition: opacity 0.15s;
        pointer-events: none;
      }
      .pw-btn.cooling::before {
        opacity: 1;
      }

      /* Tienda */
      .shop-btn {
        padding: 8px 16px;
        border: 2px solid #ffd70088;
        border-radius: 6px;
        background: #171200;
        color: #ffd700;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        animation: pm-btn-pulse 2.4s ease-in-out infinite;
      }
      .shop-btn:active {
        transform: scale(0.95);
      }
      .shop {
        position: absolute;
        inset: 4% 4%;
        z-index: 20;
        background: radial-gradient(ellipse at top, #161200, #0a0a0a 60%);
        border: 2px solid #ffd700;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        box-shadow:
          0 0 40px rgba(0, 0, 0, 0.85),
          0 0 24px #ffd70044;
      }
      .shop.hidden {
        display: none;
      }
      .shop-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid #333;
        color: #ffd700;
        font-weight: 700;
        letter-spacing: 2px;
        font-size: 13px;
        flex: none;
      }
      .shop-close {
        background: none;
        border: none;
        color: #aaa;
        font-size: 16px;
        cursor: pointer;
        padding: 2px 10px;
      }
      .shop-body {
        flex: 1;
        overflow-y: auto;
        padding: 10px 14px;
      }
      .shop-loading {
        color: #777;
        font-size: 12px;
        text-align: center;
        margin-top: 20px;
      }
      .shop-section-title {
        font-size: 11px;
        letter-spacing: 3px;
        color: #ffd700;
        text-shadow: 0 0 8px #ffd70066;
        margin: 16px 0 8px;
      }
      .shop-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
        gap: 10px;
      }
      .shop-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        padding: 10px 8px;
        border: 1px solid #2a2a2a;
        border-radius: 10px;
        background: linear-gradient(#141414, #0a0a0a);
        transition:
          border-color 0.15s,
          box-shadow 0.15s;
      }
      .shop-card:has(.shop-select-btn.active) {
        border-color: #ffd700;
        box-shadow: 0 0 14px #ffd70033;
      }
      .shop-card-preview {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 54px;
        width: 100%;
      }
      .shop-preview-canvas {
        image-rendering: crisp-edges;
      }
      .shop-maze-swatch {
        position: relative;
        width: 64px;
        height: 44px;
        border-radius: 6px;
        border: 2px solid #444;
        overflow: hidden;
      }
      .shop-maze-swatch-block {
        position: absolute;
        left: 8px;
        top: 6px;
        width: 20px;
        height: 20px;
        border-radius: 3px;
      }
      .shop-maze-swatch-block::after {
        content: '';
        position: absolute;
        left: 26px;
        top: 0;
        width: 14px;
        height: 20px;
        background: inherit;
        border-radius: 3px;
      }
      .shop-maze-swatch-dot {
        position: absolute;
        right: 10px;
        bottom: 9px;
        width: 6px;
        height: 6px;
        border-radius: 50%;
      }
      .shop-maze-swatch-random {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a1a;
      }
      .shop-card-icon {
        font-size: 30px;
      }

      /* Mini ilustración de una GameBoy DMG para la tarjeta de la tienda */
      .gb-device {
        position: relative;
        width: 46px;
        height: 58px;
        background: linear-gradient(#d9d7de, #c3c0c9);
        border: 1px solid #8d8a95;
        border-radius: 4px 4px 12px 4px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      }
      .gb-device-bezel {
        position: absolute;
        left: 6px;
        top: 6px;
        width: 34px;
        height: 24px;
        background: #57545e;
        border-radius: 2px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .gb-device-screen {
        width: 26px;
        height: 16px;
        border: 1px solid rgba(0, 0, 0, 0.4);
      }
      .gb-device-led {
        position: absolute;
        left: 4px;
        top: 4px;
        width: 3px;
        height: 3px;
        border-radius: 50%;
        background: #ff4136;
      }
      .gb-device-dpad {
        position: absolute;
        left: 7px;
        bottom: 6px;
        width: 11px;
        height: 11px;
        background: #3a3742;
        clip-path: polygon(
          33% 0,
          66% 0,
          66% 33%,
          100% 33%,
          100% 66%,
          66% 66%,
          66% 100%,
          33% 100%,
          33% 66%,
          0 66%,
          0 33%,
          33% 33%
        );
      }
      .gb-device-buttons {
        position: absolute;
        right: 5px;
        bottom: 9px;
        display: flex;
        gap: 3px;
      }
      .gb-device-buttons span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: #7d1a4a;
      }
      .shop-card-name {
        font-size: 11px;
        font-weight: 700;
        color: #fff;
        text-align: center;
        line-height: 1.25;
      }
      .shop-card-desc {
        font-size: 9px;
        color: #999;
        text-align: center;
        line-height: 1.3;
        min-height: 22px;
      }
      .shop-card-footer {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        width: 100%;
        margin-top: 2px;
      }
      .shop-item-action {
        flex: none;
        padding: 6px 12px;
        border-radius: 5px;
        border: none;
        font-family: inherit;
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
        white-space: nowrap;
        width: 100%;
      }
      .shop-owned-tag {
        background: #1a1500;
        color: #ffd700;
        border: 1px solid #ffd700;
        text-align: center;
        display: inline-block;
      }
      .shop-select-btn {
        background: #222;
        color: #ccc;
        border: 1px solid #555;
      }
      .shop-select-btn.active {
        background: #1a1500;
        color: #ffd700;
        border-color: #ffd700;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <div id="hud">
        <div class="hitem">⭐ <span id="score" class="hval">0</span></div>
        <div class="hitem">NV <span id="level" class="hval">1</span></div>
        <div class="hitem">
          <span style="color: #aaa">❤</span>
          <div class="lives-icons" id="lives-wrap"></div>
        </div>
      </div>
      <div id="stage" style="position: relative">
        <canvas id="game"></canvas>
        <div id="crt" class="crt-overlay"></div>
        <div id="overlay">
          <h1 id="overlay-title">PAC-MAZE DFS</h1>
          <p id="overlay-score"></p>
          <p id="overlay-hint">Desliza para moverte</p>
          <div class="option-group">
            <span class="option-label">DIFICULTAD</span>
            <div id="diff-btns" class="btn-row">
              <button class="diff-btn" data-diff="easy">
                🟢 FÁCIL
                <span class="dlabel">Fantasmas lentos</span>
              </button>
              <button class="diff-btn selected" data-diff="normal">
                🟡 NORMAL
                <span class="dlabel">Fantasmas rápidos</span>
              </button>
              <button class="diff-btn" data-diff="hard">
                🔴 DIFÍCIL
                <span class="dlabel">Fantasmas veloces</span>
              </button>
            </div>
          </div>
          <div class="option-group">
            <span class="option-label">CONTROLES</span>
            <div id="ctrl-btns" class="btn-row">
              <button class="ctrl-btn selected" data-ctrl="swipe">
                👆
                <span class="dlabel">Deslizar</span>
              </button>
              <button class="ctrl-btn" data-ctrl="joystick">
                🕹️
                <span class="dlabel">Palanca</span>
              </button>
            </div>
          </div>
          <button id="shopBtn" class="shop-btn">🛒 TIENDA</button>
          <button id="coffeeBtn" class="coffee-btn">☕ Buy Me a Coffee</button>
          <button id="startBtn">JUGAR</button>
        </div>
        <div id="joystick" class="joystick hidden">
          <div class="joystick-base"></div>
          <div id="joystick-knob" class="joystick-knob"></div>
        </div>
        <div id="pw-btns" class="pw-btns">
          <button id="laserBtn" class="pw-btn hidden" title="Láser — tecla Q (20s)">
            <span class="pw-icon">🔫</span>
            <span class="pw-key">Q</span>
          </button>
          <button id="teleportBtn" class="pw-btn hidden" title="Teletransporte — tecla E (20s)">
            <span class="pw-icon">🌀</span>
            <span class="pw-key">E</span>
          </button>
          <button id="mineBtn" class="pw-btn hidden" title="Mina — tecla R (20s)">
            <span class="pw-icon">💣</span>
            <span class="pw-key">R</span>
          </button>
        </div>
        <div id="shop" class="shop hidden">
          <div class="shop-header">
            <span>TIENDA</span>
            <button id="shopClose" class="shop-close">✕</button>
          </div>
          <div id="shopBody" class="shop-body">
            <p class="shop-loading">Cargando...</p>
          </div>
        </div>
      </div>
    </div>
    <script src="pacman-game.js"></script>
  </body>
</html>
